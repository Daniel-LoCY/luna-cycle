name: luna_cycle
description: An offline-first menstrual cycle and health journal.
publish_to: 'none'
version: 1.1.1+4

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cupertino_ui: ^1.1.6
  cryptography: ^2.9.0
  drift: ^2.35.4
  fl_chart: ^1.3.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.0.0
  go_router: ^18.1.4
  intl: ^0.20.2
  local_auth: ^3.0.2
  material_ui: ^1.11.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3: ^3.9.1
  uuid: ^4.5.1
  file_picker: ^13.3.3
  share_plus: ^13.3.1
  pdf: ^3.13.1
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.10.4
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/NotoSansTC-VF.ttf

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
